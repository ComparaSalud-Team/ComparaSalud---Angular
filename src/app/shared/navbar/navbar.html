<nav class="dashboard-navbar">
  <div class="dashboard-left">
    <a routerLink="/home" class="dashboard-logo">
      <img src="assets/icons/logo.png" alt="ComparaSalud">
      <span>ComparaSalud</span>
    </a>
    <div class="dashboard-menu">
      <a routerLink="/dashboard"       routerLinkActive="active">Buscar</a>
      <a routerLink="/dashboard/citas" routerLinkActive="active">Mis citas</a>
      <a href="#">Mis favoritos</a>
      <a href="#">Documentos</a>

  </div>
